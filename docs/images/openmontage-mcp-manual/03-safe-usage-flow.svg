<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#18112b"/>
    </linearGradient>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <marker id="ar3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font:700 44px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#fff}
      .sub{font:400 21px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#a5b4fc}
      .h{font:700 24px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#fff}
      .b{font:500 18px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#cbd5e1}
      .n{font:800 20px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#fff}
      .gate{font:800 22px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#fef3c7}
    </style>
  </defs>
  <rect width="1600" height="1000" rx="32" fill="url(#bg3)"/>
  <text x="75" y="80" class="title">안전한 영상 제작 흐름</text>
  <text x="75" y="122" class="sub">“기획 → 비용 확인 → 승인 → 생성” 순서를 지키면 원치 않는 과금과 provider 자동 전환을 막을 수 있습니다.</text>

  <g filter="url(#sh3)">
    <rect x="85" y="205" width="250" height="150" rx="24" fill="#10243e" stroke="#3b82f6"/>
    <circle cx="125" cy="245" r="20" fill="#2563eb"/><text x="118" y="253" class="n">1</text>
    <text x="115" y="300" class="h">자연어 요청</text>
    <text x="115" y="330" class="b">길이·비율·provider 명시</text>
  </g>
  <path d="M335 280 H415" stroke="#94a3b8" stroke-width="5" marker-end="url(#ar3)"/>
  <g filter="url(#sh3)">
    <rect x="440" y="205" width="250" height="150" rx="24" fill="#1e1b4b" stroke="#6366f1"/>
    <circle cx="480" cy="245" r="20" fill="#4f46e5"/><text x="473" y="253" class="n">2</text>
    <text x="470" y="300" class="h">OpenMontage 기획</text>
    <text x="470" y="330" class="b">대본·씬·프롬프트·job</text>
  </g>
  <path d="M690 280 H770" stroke="#94a3b8" stroke-width="5" marker-end="url(#ar3)"/>
  <g filter="url(#sh3)">
    <rect x="795" y="205" width="250" height="150" rx="24" fill="#2e1065" stroke="#8b5cf6"/>
    <circle cx="835" cy="245" r="20" fill="#7c3aed"/><text x="828" y="253" class="n">3</text>
    <text x="825" y="300" class="h">카탈로그 조회</text>
    <text x="825" y="330" class="b">모델·해상도·시간·비용</text>
  </g>
  <path d="M1045 280 H1125" stroke="#94a3b8" stroke-width="5" marker-end="url(#ar3)"/>
  <g filter="url(#sh3)">
    <rect x="1150" y="205" width="365" height="150" rx="24" fill="#4a1d0b" stroke="#f59e0b" stroke-width="3"/>
    <text x="1180" y="255" class="gate">⏸ 사용자 승인 게이트</text>
    <text x="1180" y="300" class="b">provider · model · 옵션 · credits 확인</text>
    <text x="1180" y="332" class="b">승인 전에는 생성 호출 없음</text>
  </g>

  <path d="M1330 355 V445" stroke="#94a3b8" stroke-width="5" marker-end="url(#ar3)"/>
  <g filter="url(#sh3)">
    <rect x="1150" y="470" width="365" height="150" rx="24" fill="#3b0a3c" stroke="#d946ef"/>
    <circle cx="1190" cy="510" r="20" fill="#c026d3"/><text x="1183" y="518" class="n">4</text>
    <text x="1225" y="518" class="h">선택한 MCP만 생성</text>
    <text x="1180" y="562" class="b">--yes + --approved-cost</text>
    <text x="1180" y="592" class="b">다른 provider로 자동 전환하지 않음</text>
  </g>
  <path d="M1150 545 H1070" stroke="#94a3b8" stroke-width="5" marker-end="url(#ar3)"/>
  <g filter="url(#sh3)">
    <rect x="795" y="470" width="250" height="150" rx="24" fill="#172554" stroke="#60a5fa"/>
    <circle cx="835" cy="510" r="20" fill="#2563eb"/><text x="828" y="518" class="n">5</text>
    <text x="825" y="565" class="h">상태 조회</text>
    <text x="825" y="595" class="b">성공 / 실패 / timeout</text>
  </g>
  <path d="M795 545 H715" stroke="#94a3b8" stroke-width="5" marker-end="url(#ar3)"/>
  <g filter="url(#sh3)">
    <rect x="440" y="470" width="250" height="150" rx="24" fill="#083344" stroke="#22d3ee"/>
    <circle cx="480" cy="510" r="20" fill="#0891b2"/><text x="473" y="518" class="n">6</text>
    <text x="470" y="565" class="h">결과 정규화</text>
    <text x="470" y="595" class="b">파일 + asset_manifest</text>
  </g>
  <path d="M440 545 H360" stroke="#94a3b8" stroke-width="5" marker-end="url(#ar3)"/>
  <g filter="url(#sh3)">
    <rect x="85" y="470" width="250" height="150" rx="24" fill="#052e16" stroke="#22c55e"/>
    <circle cx="125" cy="510" r="20" fill="#16a34a"/><text x="118" y="518" class="n">7</text>
    <text x="115" y="565" class="h">OpenMontage 조립</text>
    <text x="115" y="595" class="b">편집·자막·음악·렌더</text>
  </g>

  <g filter="url(#sh3)">
    <rect x="85" y="725" width="1430" height="170" rx="28" fill="#111827" stroke="#475569"/>
    <text x="120" y="775" class="h">실패했을 때</text>
    <rect x="120" y="805" width="300" height="54" rx="27" fill="#7f1d1d"/>
    <text x="157" y="839" class="h">자동 재제출하지 않음</text>
    <rect x="455" y="805" width="300" height="54" rx="27" fill="#7c2d12"/>
    <text x="488" y="839" class="h">다른 MCP로 바꾸지 않음</text>
    <rect x="790" y="805" width="300" height="54" rx="27" fill="#713f12"/>
    <text x="836" y="839" class="h">작업 ID와 오류 보고</text>
    <rect x="1125" y="805" width="330" height="54" rx="27" fill="#3f3f46"/>
    <text x="1161" y="839" class="h">사용자가 다음 행동 결정</text>
  </g>
</svg>
