<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
    <style>
      .title{font:700 44px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#f8fafc}
      .sub{font:400 22px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#94a3b8}
      .h{font:700 26px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#f8fafc}
      .b{font:500 20px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#dbeafe}
      .s{font:500 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#a5b4fc}
      .pill{font:700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#e0e7ff}
    </style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="1240" cy="120" r="250" fill="#7c3aed" opacity=".08"/>
  <circle cx="260" cy="760" r="280" fill="#0ea5e9" opacity=".07"/>

  <text x="80" y="85" class="title">OpenMontage + MCP Provider 구조</text>
  <text x="80" y="125" class="sub">기획은 OpenMontage가, 생성은 사용자가 선택한 MCP가, 결과 조립은 다시 OpenMontage가 담당합니다.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="410" height="480" rx="28" fill="#0f1d31" stroke="#334155" stroke-width="2"/>
    <rect x="95" y="230" width="128" height="36" rx="18" fill="#0ea5e9" opacity=".25"/>
    <text x="115" y="254" class="pill">PLANNING</text>
    <text x="105" y="320" class="h">OpenMontage</text>
    <text x="105" y="360" class="b">① 아이디어·레퍼런스 분석</text>
    <text x="105" y="402" class="b">② 대본·콘셉트·씬 구성</text>
    <text x="105" y="444" class="b">③ scene_plan 생성</text>
    <text x="105" y="486" class="b">④ provider와 모델 명시</text>
    <rect x="105" y="535" width="330" height="105" rx="16" fill="#07111f" stroke="#1e3a5f"/>
    <text x="130" y="573" class="s">artifacts/scene_plan.json</text>
    <text x="130" y="605" class="s">output/jobs.json</text>
  </g>

  <path d="M480 445 C555 445 565 445 625 445" fill="none" stroke="#60a5fa" stroke-width="8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="650" y="275" width="360" height="340" rx="32" fill="url(#bridge)"/>
    <rect x="685" y="310" width="118" height="36" rx="18" fill="#fff" opacity=".16"/>
    <text x="706" y="334" class="pill">BRIDGE</text>
    <text x="690" y="405" class="h">openmontage-mcp-providers</text>
    <text x="690" y="450" class="b">• OAuth / Bearer 연결</text>
    <text x="690" y="490" class="b">• 도구·모델·비용 조회</text>
    <text x="690" y="530" class="b">• 승인 후 생성·상태 조회</text>
    <text x="690" y="570" class="b">• 결과 URL·파일 정규화</text>
  </g>

  <path d="M1010 445 C1070 445 1080 445 1135 445" fill="none" stroke="#60a5fa" stroke-width="8" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1160" y="175" width="370" height="540" rx="28" fill="#0f1d31" stroke="#334155" stroke-width="2"/>
    <rect x="1185" y="200" width="142" height="36" rx="18" fill="#8b5cf6" opacity=".28"/>
    <text x="1205" y="224" class="pill">PROVIDERS</text>
    <g>
      <rect x="1195" y="270" width="300" height="78" rx="18" fill="#172554" stroke="#3b82f6"/>
      <circle cx="1235" cy="309" r="18" fill="#60a5fa"/>
      <text x="1272" y="317" class="h">Kling MCP</text>
    </g>
    <g>
      <rect x="1195" y="365" width="300" height="78" rx="18" fill="#2e1065" stroke="#8b5cf6"/>
      <circle cx="1235" cy="404" r="18" fill="#a78bfa"/>
      <text x="1272" y="412" class="h">Magnific MCP</text>
    </g>
    <g>
      <rect x="1195" y="460" width="300" height="78" rx="18" fill="#3b0764" stroke="#d946ef"/>
      <circle cx="1235" cy="499" r="18" fill="#e879f9"/>
      <text x="1272" y="507" class="h">Higgsfield MCP</text>
    </g>
    <g>
      <rect x="1195" y="555" width="300" height="78" rx="18" fill="#451a03" stroke="#f59e0b"/>
      <circle cx="1235" cy="594" r="18" fill="#fbbf24"/>
      <text x="1272" y="602" class="h">BBANANA MCP</text>
    </g>
    <text x="1195" y="677" class="s">선택한 provider만 호출 · 자동 대체 없음</text>
  </g>

  <g>
    <rect x="70" y="755" width="1460" height="88" rx="24" fill="#111c2e" stroke="#475569"/>
    <text x="105" y="810" class="h">안전 게이트</text>
    <rect x="300" y="778" width="240" height="44" rx="22" fill="#1e3a8a"/>
    <text x="338" y="807" class="pill">모델·옵션 확인</text>
    <rect x="565" y="778" width="240" height="44" rx="22" fill="#4c1d95"/>
    <text x="610" y="807" class="pill">예상 비용 확인</text>
    <rect x="830" y="778" width="240" height="44" rx="22" fill="#701a75"/>
    <text x="878" y="807" class="pill">사용자 명시 승인</text>
    <rect x="1095" y="778" width="365" height="44" rx="22" fill="#7c2d12"/>
    <text x="1130" y="807" class="pill">실패 시 재시도·자동 전환 금지</text>
  </g>
</svg>
