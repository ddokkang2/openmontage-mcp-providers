<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#64748b" flood-opacity=".18"/>
    </filter>
    <style>
      .title{font:700 44px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}
      .sub{font:400 21px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569}
      .num{font:800 30px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#fff}
      .h{font:700 27px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033}
      .b{font:500 18px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#475569}
      .code{font:500 15px 'Cascadia Mono','Consolas',monospace;fill:#dbeafe}
      .small{font:500 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect width="1600" height="1050" rx="32" fill="url(#bg2)"/>
  <text x="75" y="85" class="title">Windows 설치 순서</text>
  <text x="75" y="125" class="sub">작업 폴더는 사용자가 직접 지정합니다. 두 저장소를 같은 상위 폴더에 두면 경로 설정이 가장 단순합니다.</text>

  <g filter="url(#sh2)">
    <rect x="80" y="180" width="1440" height="130" rx="28" fill="#fff"/>
    <circle cx="145" cy="245" r="38" fill="#2563eb"/>
    <text x="136" y="255" class="num">1</text>
    <text x="215" y="230" class="h">작업 폴더 지정</text>
    <text x="215" y="270" class="b">예: D:\AI-Video — OneDrive를 쓸 필요가 없습니다.</text>
    <rect x="785" y="205" width="675" height="80" rx="15" fill="#0f172a"/>
    <text x="815" y="238" class="code">$WorkRoot = "D:\AI-Video"</text>
    <text x="815" y="270" class="code">Set-Location $WorkRoot</text>
  </g>

  <g filter="url(#sh2)">
    <rect x="80" y="335" width="1440" height="150" rx="28" fill="#fff"/>
    <circle cx="145" cy="410" r="38" fill="#4f46e5"/>
    <text x="136" y="420" class="num">2</text>
    <text x="215" y="390" class="h">두 저장소 복제</text>
    <text x="215" y="430" class="b">OpenMontage와 MCP 브리지를 나란히 둡니다.</text>
    <rect x="785" y="352" width="675" height="116" rx="15" fill="#0f172a"/>
    <text x="815" y="385" class="code">git clone https://github.com/calesthio/OpenMontage.git</text>
    <text x="815" y="418" class="code">git clone `</text>
    <text x="815" y="450" class="code">  https://github.com/ddokkang2/openmontage-mcp-providers.git</text>
  </g>

  <g filter="url(#sh2)">
    <rect x="80" y="510" width="1440" height="150" rx="28" fill="#fff"/>
    <circle cx="145" cy="585" r="38" fill="#7c3aed"/>
    <text x="136" y="595" class="num">3</text>
    <text x="215" y="565" class="h">의존성 설치</text>
    <text x="215" y="605" class="b">OpenMontage는 Python·FFmpeg·Node, 브리지는 Node 20+.</text>
    <rect x="785" y="535" width="675" height="100" rx="15" fill="#0f172a"/>
    <text x="815" y="572" class="code">OpenMontage: .venv + requirements.txt + remotion-composer</text>
    <text x="815" y="610" class="code">Bridge: npm.cmd install</text>
  </g>

  <g filter="url(#sh2)">
    <rect x="80" y="685" width="1440" height="130" rx="28" fill="#fff"/>
    <circle cx="145" cy="750" r="38" fill="#c026d3"/>
    <text x="136" y="760" class="num">4</text>
    <text x="215" y="735" class="h">OpenMontage shim 설치</text>
    <text x="215" y="775" class="b">먼저 dry-run으로 대상 파일을 확인한 뒤 실제 설치합니다.</text>
    <rect x="785" y="710" width="675" height="80" rx="15" fill="#0f172a"/>
    <text x="815" y="742" class="code">node src\cli.js install-openmontage --path ..\OpenMontage `</text>
    <text x="815" y="772" class="code">  --providers all --yes</text>
  </g>

  <g filter="url(#sh2)">
    <rect x="80" y="840" width="1440" height="135" rx="28" fill="#fff"/>
    <circle cx="145" cy="907" r="38" fill="#ea580c"/>
    <text x="136" y="917" class="num">5</text>
    <text x="215" y="890" class="h">인증 후 doctor 실행</text>
    <text x="215" y="930" class="b">OAuth 또는 토큰 연결 후 readiness 영수증을 만듭니다.</text>
    <rect x="785" y="865" width="675" height="80" rx="15" fill="#0f172a"/>
    <text x="815" y="897" class="code">node src\cli.js doctor --provider magnific</text>
    <text x="815" y="927" class="code">node src\cli.js doctor --provider bbanana</text>
  </g>

  <text x="80" y="1018" class="small">완료 기준: install-openmontage의 alreadyInstalled=true + doctor의 authorization=connected</text>
</svg>
